<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Sudarshan Foods</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/farar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/order.css') }}">
</head>
<body>
    <div class="order-wrapper" style="max-width: 420px; margin: 80px auto;">
        <div class="order-card">
            <h2 style="text-align: center; margin-bottom: 15px;">🔐 Admin Portal Login</h2>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <p style="color: #DC2626; text-align: center; font-weight: bold;">{{ messages[0] }}</p>
                {% endif %}
            {% endwith %}
            <form method="POST" class="order-form">
                <div class="form-group">
                    <label>Admin Access Code</label>
                    <input type="password" name="admin_code" placeholder="Enter Admin Secret Key" required>
                </div>
                <button type="submit" class="btn-submit">UNLOCK DASHBOARD</button>
            </form>
        </div>
    </div>
</body>
</html>
